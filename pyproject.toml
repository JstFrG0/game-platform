[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-platform"
version = "0.1.0"
description = "Windows local game intelligence project: IGDB year collection"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "fastapi==0.143.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
collect-igdb = "game_platform.collect_igdb:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
